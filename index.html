<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Rastreador">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#eef1f6">

    <title>Registro_Tracker</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="manifest" href="manifest.json">

    <style>
        /* ============================================================
           PALETA (tomada de la imagen de referencia)
           ============================================================ */
        :root {
            --fondo:        #eef1f6;   /* gris azulado claro de fondo   */
            --tarjeta:      #ffffff;   /* tarjetas blancas              */
            --borde:        #dbe3ee;   /* borde sutil de tarjetas       */
            --navy:         #134a8e;   /* azul principal (texto/botón)  */
            --navy-oscuro:  #0d3a75;   /* azul de énfasis               */
            --naranja:      #e8a020;   /* insignia superior             */
            --verde:        #18a558;   /* estado OK                     */
            --verde-suave:  #e6f4ec;   /* fondo del pill verde          */
            --rojo:         #d93838;   /* estado offline                */
            --rojo-suave:   #fdecec;
            --azul-sync:    #1b6fd6;   /* sincronizando                 */
            --azul-suave:   #e8f1fd;
            --gris-texto:   #8a94a6;   /* etiquetas secundarias         */
            --radio: 14px;
        }

        * { box-sizing: border-box; }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: var(--fondo);
            font-family: -apple-system, "Segoe UI", "Trebuchet MS", Arial, sans-serif;
            overscroll-behavior: none;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            margin: 0 auto;
            padding: 12px;
            padding-bottom: env(safe-area-inset-bottom, 16px);
            display: flex;
            flex-direction: column;
            gap: 10px;
            color: var(--navy);
        }

        /* --- Cabecera: marca + GPS --- */
        .header-card {
            background: var(--tarjeta);
            border: 1px solid var(--borde);
            border-radius: var(--radio);
            padding: 12px 16px;
            flex-shrink: 0;
        }
        .brand {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }
        .brand .logo-text {
            font-size: 20px;
            font-weight: 900;
            font-style: italic;
            color: var(--navy-oscuro);
        }
        .brand .brand-sub {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--navy);
            text-transform: uppercase;
        }
        .gps-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            font-size: 12px;
            font-weight: 700;
        }
        .gps-row .gps-label { color: var(--navy); text-transform: uppercase; }
        .gps-row .gps-label.buscando { color: var(--naranja); }
        .gps-row .gps-coords { color: var(--navy-oscuro); font-weight: 800; }

        /* --- Pill de estado del servidor --- */
        .server-status-bar {
            border-radius: var(--radio);
            padding: 12px;
            text-align: center;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: .5px;
            text-transform: uppercase;
            border: 1px solid var(--borde);
            transition: all .3s ease;
            flex-shrink: 0;
        }
        .server-online  { background: var(--verde-suave); color: var(--verde);    border-color: #bfe5d0; }
        .server-offline { background: var(--rojo-suave);  color: var(--rojo);     border-color: #f3c9c9; }
        .server-syncing { background: var(--azul-suave);  color: var(--azul-sync);border-color: #c4dcf8; }
        .server-loading { background: #fdf3e3;            color: var(--naranja);  border-color: #f0ddb8; }

        /* --- Hora / Fecha --- */
        .grid-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            flex-shrink: 0;
        }
        .info-card {
            background: var(--tarjeta);
            border: 1px solid var(--borde);
            border-radius: var(--radio);
            padding: 14px 8px;
            text-align: center;
        }
        .info-card .valor {
            font-size: 24px;
            font-weight: 900;
            color: var(--navy-oscuro);
            font-variant-numeric: tabular-nums;
        }
        .info-card .etiqueta {
            font-size: 12px;
            color: var(--gris-texto);
            font-weight: 600;
            margin-top: 4px;
        }

        /* --- Cronómetro --- */
        .timer-card {
            background: var(--tarjeta);
            border: 1px solid var(--borde);
            border-radius: var(--radio);
            width: 100%;
            padding: 20px 16px;
            text-align: center;
            box-shadow: 0 4px 14px rgba(13, 58, 117, 0.08);
            flex-shrink: 0;
        }
        .timer-card .timer-label {
            display: inline-block;
            background: var(--navy);
            color: #fff;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 6px 16px;
            border-radius: 999px;
            margin-bottom: 14px;
        }
        .timer-card .timer-valor {
            font-size: 44px;
            font-weight: 900;
            color: var(--navy-oscuro);
            font-variant-numeric: tabular-nums;
            line-height: 1;
        }
        .timer-card .timer-sub {
            font-size: 12px;
            color: var(--gris-texto);
            font-weight: 600;
            margin-top: 10px;
        }

        /* --- Lista de coordenadas --- */
        .lista-card {
            background: var(--tarjeta);
            border: 1px solid var(--navy);
            border-radius: var(--radio);
            flex: 1;
            min-height: 0;            /* permite que el scroll interno funcione */
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .lista-header {
            padding: 10px 14px;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: .5px;
            text-transform: uppercase;
            color: var(--navy);
            border-bottom: 1px solid var(--borde);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .lista-header .lista-contador {
            color: var(--gris-texto);
            font-weight: 700;
            text-transform: none;
        }
        .lista-body {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 4px 14px 12px;
        }
        .lista-vacia {
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--gris-texto);
            font-size: 14px;
            font-weight: 600;
        }
        .coord-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            padding: 9px 2px;
            border-bottom: 1px dashed var(--borde);
            font-size: 13px;
        }
        .coord-hora {
            color: var(--gris-texto);
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            flex-shrink: 0;
        }
        .coord-valor {
            color: var(--navy-oscuro);
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            flex: 1;
            text-align: center;
        }
        .coord-estado {
            flex-shrink: 0;
            font-size: 12px;
            font-weight: 800;
        }
        .coord-estado.pendiente { color: var(--naranja); }
        .coord-estado.enviado   { color: var(--verde); }
    </style>
</head>
<body onload="iniciarSistema()">
    <div class="container">

        <div class="header-card">
            <div class="brand">
                <span class="logo-text">AIR</span>
                <span class="brand-sub">Control</span>
            </div>
            <div class="gps-row" id="gpsBar">
                <span class="gps-label buscando" id="gpsLabel">📍 GPS: Buscando señal...</span>
                <span class="gps-coords" id="gpsCoords">---, ---</span>
            </div>
        </div>

        <div id="serverStatus" class="server-status-bar server-loading">
            🟠 Iniciando sistema...
        </div>

        <div class="grid-row">
            <div class="info-card">
                <div class="valor" id="txtHora">--:--:--</div>
                <div class="etiqueta">Hora</div>
            </div>
            <div class="info-card">
                <div class="valor" id="txtFecha">--/--/----</div>
                <div class="etiqueta">Fecha</div>
            </div>
        </div>

        <div class="timer-card">
            <div class="timer-label">Tiempo de rastreo</div>
            <div class="timer-valor" id="cronometro">00:00:00</div>
            <div class="timer-sub" id="resumenRegistros">0 puntos registrados · 0 pendientes</div>
        </div>

        <div class="lista-card">
            <div class="lista-header">
                <span>Lista de coordenadas</span>
                <span class="lista-contador" id="listaContador">0 puntos</span>
            </div>
            <div class="lista-body" id="listaBody">
                <div class="lista-vacia" id="listaVacia">Esperando primera coordenada...</div>
            </div>
        </div>
    </div>

    <script>
    "use strict";

    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbySvbR0d_3v-IL0E_plszAPgWo9jSP4DKsC9yvx8i5CRP1KLZZPaLTqDoLDOKQ2nr4mhA/exec";

    // Claves de almacenamiento local
    const KEY_COLA       = 'pendingTracking';  // registros aún no confirmados por el servidor
    const KEY_HISTORIAL  = 'trackingLocal';    // respaldo local (limitado) de puntos enviados
    const KEY_LOCALDB    = 'localDB';          // datos iniciales descargados del servidor

    const MAX_HISTORIAL  = 2000;   // tope de filas guardadas localmente (evita llenar localStorage)
    const LOTE_MAXIMO    = 50;     // filas por envío al servidor
    const INTERVALO_GPS  = 30000;  // ms entre puntos de rastreo
    const INTERVALO_SYNC = 60000;  // ms entre reintentos de sincronización

    let ultimaLat = null, ultimaLon = null;
    let datosAires = [];
    let appStartTime = Date.now();
    let totalRegistrados = 0;

    /* ============================================================
       MEJORA 5: cola sin condiciones de carrera.
       Un único candado (sincronizando) y helpers que SIEMPRE
       releen localStorage antes de modificarlo. Las filas nuevas
       se agregan al final y la sincronización consume del frente,
       por lo que nunca se pisan entre sí.
       ============================================================ */
    let sincronizando = false;

    const obtenerCola = () => JSON.parse(localStorage.getItem(KEY_COLA) || '[]');
    const guardarCola = (c) => localStorage.setItem(KEY_COLA, JSON.stringify(c));

    function encolarFila(fila) {
        const cola = obtenerCola();
        cola.push(fila);
        guardarCola(cola);
        agregarEntradaLista(fila, 'pendiente');
        actualizarResumen();
    }

    /* ============================================================
       MEJORA 2: confirmación real del servidor.
       Se elimina mode:"no-cors". Apps Script (desplegado con acceso
       "Cualquier persona" y respondiendo con ContentService) sí
       devuelve cabeceras CORS, así que podemos leer la respuesta y
       solo vaciar la cola cuando el servidor confirma {ok:true}.
       ============================================================ */
    async function enviarLote(filas) {
        try {
            const resp = await fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // simple request: sin preflight
                body: JSON.stringify({ tipo: 'TRACKING_DELTA', filas: filas })
            });
            if (!resp.ok) return false;
            const r = await resp.json();
            return r && r.ok === true;
        } catch (e) {
            return false;
        }
    }

    /* ============================================================
       MEJORA 3: envío por deltas.
       Ya no se reenvía el libro completo cada 30 s: solo las filas
       nuevas de TRACKING, en lotes. El historial local se limita a
       MAX_HISTORIAL filas, así localStorage nunca se desborda.
       ============================================================ */
    async function sincronizar() {
        if (sincronizando || !navigator.onLine) return;

        const colaInicial = obtenerCola();
        if (colaInicial.length === 0) {
            actualizarEstadoUI();
            return;
        }

        sincronizando = true;
        mostrarEstado('syncing', `🔄 Sincronizando (${colaInicial.length} pendientes)...`);

        try {
            while (true) {
                const cola = obtenerCola();
                if (cola.length === 0) break;

                const lote = cola.slice(0, LOTE_MAXIMO);
                const ok = await enviarLote(lote);

                if (!ok) {
                    mostrarEstado('offline', `⚠️ Error al subir (${obtenerCola().length} pendientes, se reintentará)`);
                    return;
                }

                // Releer la cola: el rastreador pudo agregar filas mientras enviábamos.
                const colaActual = obtenerCola();
                guardarCola(colaActual.slice(lote.length));
                agregarAlHistorial(lote);
                marcarEnviadasUI(lote.length);
                actualizarResumen();
            }
            mostrarEstado('online', '🟢 Conexión con servidor: OK');
        } finally {
            sincronizando = false;
            actualizarResumen();
        }
    }

    function agregarAlHistorial(filas) {
        let hist = JSON.parse(localStorage.getItem(KEY_HISTORIAL) || '[]');
        hist.push(...filas);
        if (hist.length > MAX_HISTORIAL) hist = hist.slice(-MAX_HISTORIAL);
        localStorage.setItem(KEY_HISTORIAL, JSON.stringify(hist));
        totalRegistrados = hist.length + obtenerCola().length;
    }

    /* ============================================================
       MEJORA 1: Wake Lock para que la pantalla no se apague
       (los navegadores suspenden el GPS y los timers con la
       pantalla apagada). Se re-solicita al volver a primer plano.
       ============================================================ */
    let wakeLock = null;
    async function solicitarWakeLock() {
        try {
            if ('wakeLock' in navigator) {
                wakeLock = await navigator.wakeLock.request('screen');
                console.log('🔆 Wake Lock activo: la pantalla no se apagará.');
            }
        } catch (e) {
            console.warn('Wake Lock no disponible:', e.message);
        }
    }
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
            solicitarWakeLock();
            sincronizar();
        }
    });

    /* ============================================================
       MEJORA 4: Service Worker como archivo real (sw.js) en lugar
       de un Blob URL (incompatible en varios navegadores).
       ============================================================ */
    function instalarServiceWorker() {
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log('⚙️ Service Worker activo.'))
                .catch(err => console.warn('SW error:', err));
        }
    }

    /* ============================================================
       PROTECCIONES (se mantienen del diseño original)
       ============================================================ */
    function anularBotonAtras() {
        window.history.pushState(null, null, window.location.href);
        window.addEventListener('popstate', () => {
            window.history.pushState(null, null, window.location.href);
        });
    }

    window.addEventListener('keydown', (e) => {
        if (e.key === 'F5' || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'r')) {
            e.preventDefault();
            const pendientes = obtenerCola().length;
            alert(pendientes > 0
                ? `⛔ RECARGA BLOQUEADA\n\nTienes ${pendientes} registros sin sincronizar.`
                : '⛔ RECARGA BLOQUEADA\n\nPor seguridad, la recarga manual está deshabilitada.');
        }
    });

    window.addEventListener('beforeunload', (event) => {
        if (!navigator.onLine || obtenerCola().length > 0) {
            event.preventDefault();
            event.returnValue = '⚠️ Tienes datos sin sincronizar.';
            return event.returnValue;
        }
    });

    /* ============================================================
       CONEXIÓN
       ============================================================ */
    window.addEventListener('online', () => {
        sincronizar();
        if (obtenerCola().length === 0) cargarDatosEnSegundoPlano();
    });

    window.addEventListener('offline', () => {
        mostrarEstado('offline', `⚠️ Modo offline (${obtenerCola().length} pendientes)`);
    });

    /* ============================================================
       INICIO
       ============================================================ */
    async function iniciarSistema() {
        anularBotonAtras();
        instalarServiceWorker();
        solicitarWakeLock();
        gestionarGPSPersistente();

        const hist = JSON.parse(localStorage.getItem(KEY_HISTORIAL) || '[]');
        totalRegistrados = hist.length + obtenerCola().length;
        restaurarLista(hist);

        const localData = localStorage.getItem(KEY_LOCALDB);
        if (localData) {
            procesarDatosJSON(JSON.parse(localData));
            actualizarEstadoUI();
        } else if (!navigator.onLine) {
            mostrarEstado('offline', '🔴 Sin datos iniciales. Necesita internet 1 vez.');
        }

        if (navigator.onLine) {
            await sincronizar();
            cargarDatosEnSegundoPlano();
        }

        iniciarRastreador();
        setInterval(sincronizar, INTERVALO_SYNC);   // reintento periódico
        setInterval(actualizarCronometro, 1000);
        setInterval(actualizarReloj, 1000);
        actualizarReloj();
        actualizarResumen();
    }

    async function cargarDatosEnSegundoPlano() {
        if (!navigator.onLine) return;
        try {
            const resp = await fetch(`${SCRIPT_URL}?t=${Date.now()}`);
            if (resp.ok) {
                const data = await resp.json();
                localStorage.setItem(KEY_LOCALDB, JSON.stringify(data));
                procesarDatosJSON(data);
                if (obtenerCola().length === 0) {
                    mostrarEstado('online', '🟢 Conexión con servidor: OK');
                }
            }
        } catch (e) { /* sin conexión real: se reintentará */ }
    }

    // Los datos del servidor ya llegan como JSON de arrays:
    // se eliminó la dependencia de SheetJS (XLSX), que solo se
    // usaba para reconvertir JSON → hoja → JSON.
    function procesarDatosJSON(data) {
        const primeraHoja = Object.keys(data)[0];
        datosAires = primeraHoja ? data[primeraHoja] : [];
    }

    /* ============================================================
       GPS Y RASTREADOR
       ============================================================ */
    function gestionarGPSPersistente() {
        if (!navigator.geolocation) return;
        navigator.geolocation.watchPosition(
            (pos) => {
                ultimaLat = pos.coords.latitude.toFixed(6);
                ultimaLon = pos.coords.longitude.toFixed(6);
                const label = document.getElementById('gpsLabel');
                label.innerText = '📍 GPS: Señal fijada';
                label.classList.remove('buscando');
                document.getElementById('gpsCoords').innerText = `${ultimaLat}, ${ultimaLon}`;
            },
            () => {
                const label = document.getElementById('gpsLabel');
                label.innerText = '⚠️ Buscando satélites...';
                label.classList.add('buscando');
            },
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
    }

    function iniciarRastreador() {
        setInterval(() => {
            if (!ultimaLat || !ultimaLon) return;
            totalRegistrados++;
            encolarFila([ultimaLat, ultimaLon, getFechaActual(), getHoraActual()]);
            sincronizar(); // intenta enviar de inmediato; si falla, queda en cola
        }, INTERVALO_GPS);
    }

    /* ============================================================
       FECHA / HORA / UI
       ============================================================ */
    const pad = n => n.toString().padStart(2, '0');

    function getFechaActual() {
        const d = new Date();
        return `'${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`;
    }

    function getHoraActual() {
        const d = new Date();
        return `'${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }

    function actualizarReloj() {
        const d = new Date();
        document.getElementById('txtHora').innerText  = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
        document.getElementById('txtFecha').innerText = `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`;
    }

    function actualizarCronometro() {
        const seg = Math.floor((Date.now() - appStartTime) / 1000);
        const h = pad(Math.floor(seg / 3600));
        const m = pad(Math.floor((seg % 3600) / 60));
        const s = pad(seg % 60);
        document.getElementById('cronometro').innerText = `${h}:${m}:${s}`;
    }

    function actualizarResumen() {
        const pendientes = obtenerCola().length;
        document.getElementById('resumenRegistros').innerText =
            `${totalRegistrados} puntos registrados · ${pendientes} pendientes`;
        document.getElementById('listaContador').innerText =
            `${totalRegistrados} ${totalRegistrados === 1 ? 'punto' : 'puntos'}`;
        if (!sincronizando) actualizarEstadoUI();
    }

    /* ============================================================
       LISTA DE COORDENADAS
       Cada punto capturado (cada 30 s) se agrega arriba de la lista
       con su hora y estado: ⏳ pendiente → ✓ enviado al confirmarse.
       ============================================================ */
    const MAX_LISTA = 100;            // filas visibles como máximo
    let entradasPendientesUI = [];    // elementos esperando confirmación

    const sinApostrofe = v => String(v).replace(/^'/, '');

    function agregarEntradaLista(fila, estado) {
        const body = document.getElementById('listaBody');
        const vacio = document.getElementById('listaVacia');
        if (vacio) vacio.remove();

        const div = document.createElement('div');
        div.className = 'coord-item';

        const hora = document.createElement('span');
        hora.className = 'coord-hora';
        hora.textContent = sinApostrofe(fila[3]);

        const valor = document.createElement('span');
        valor.className = 'coord-valor';
        valor.textContent = `${fila[0]}, ${fila[1]}`;

        const est = document.createElement('span');
        est.className = `coord-estado ${estado}`;
        est.textContent = estado === 'enviado' ? '✓ Enviado' : '⏳ Pendiente';

        div.append(hora, valor, est);
        body.prepend(div);   // la más reciente siempre arriba

        if (estado === 'pendiente') entradasPendientesUI.push(div);

        // Mantener la lista liviana: se recortan las más antiguas (abajo)
        while (body.children.length > MAX_LISTA) {
            body.removeChild(body.lastChild);
        }
    }

    function marcarEnviadasUI(cantidad) {
        for (let i = 0; i < cantidad; i++) {
            const div = entradasPendientesUI.shift();
            if (!div) break;
            const est = div.querySelector('.coord-estado');
            if (est) {
                est.className = 'coord-estado enviado';
                est.textContent = '✓ Enviado';
            }
        }
    }

    function restaurarLista(historial) {
        // Primero el historial enviado (las últimas MAX_LISTA filas),
        // luego la cola pendiente; al ir con prepend, lo más nuevo
        // queda arriba y los pendientes conservan su orden de envío.
        historial.slice(-MAX_LISTA).forEach(f => agregarEntradaLista(f, 'enviado'));
        entradasPendientesUI = [];
        obtenerCola().forEach(f => agregarEntradaLista(f, 'pendiente'));
    }

    function mostrarEstado(tipo, texto) {
        const div = document.getElementById('serverStatus');
        div.innerText = texto;
        div.className = `server-status-bar server-${tipo}`;
    }

    function actualizarEstadoUI() {
        const pendientes = obtenerCola().length;
        if (!navigator.onLine) {
            mostrarEstado('offline', `⚠️ Modo offline (${pendientes} pendientes)`);
        } else if (pendientes > 0) {
            mostrarEstado('syncing', `🔄 Sincronizando (${pendientes} pendientes)...`);
        } else {
            mostrarEstado('online', '🟢 Conexión con servidor: OK');
        }
    }
    </script>
</body>
</html>
